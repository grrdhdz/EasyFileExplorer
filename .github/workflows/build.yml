name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (self-contained, ${{ matrix.rid }})
        run: dotnet build apps/Explorer/Explorer.csproj -c Release -r ${{ matrix.rid }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: EasyFileExplorer-${{ matrix.rid }}
          path: apps/Explorer/bin/**/Release/net8.0-windows10.0.19041.0/${{ matrix.rid }}/
          retention-days: 14

  test:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/unit/EasyFileExplorer.UnitTests.csproj -c Release
